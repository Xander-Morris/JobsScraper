name: Cron

on:
  schedule:
    - cron: "*/30 * * * *"
    # Digest runs after the 04:00 scrape.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [scrape, digest]
        default: scrape

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cron-${{ github.event.schedule == '15 4 * * *' && 'digest' || inputs.job || 'scrape' }}
    env:
      JOB: ${{ github.event.schedule == '15 4 * * *' && 'digest' || inputs.job || 'scrape' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - run: go run ./cmd/cron -job="$JOB"
        env:
          DATABASE_CONNECTION: ${{ secrets.DATABASE_CONNECTION }}
          # Must match the API's, or digest unsubscribe links fail verification.
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ vars.RESEND_FROM_ADDRESS }}
          PUBLIC_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
