# Standalone prod stack: same services as docker-compose.yml, plus Caddy
# for automatic TLS, with backend/frontend no longer publishing ports
# directly to the host (Caddy is the only public entry point on 80/443).
# Kept as its own file rather than an override of docker-compose.yml to
# avoid relying on compose's list-merge behavior for `ports`.
#
# Usage: fill in .env (see .env.example), then:
#   docker compose -f docker-compose.prod.yml up --build -d
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    expose:
      - "8090"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://${BACKEND_DOMAIN}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen2.5:7b && ollama pull nomic-embed-text"]
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
